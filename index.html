<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>William Perkins — Goal of the Season (Ambrose Treacy 9/10C)</title>
<style>
  :root {
    --bg: #0a0e0a;
    --fg: #b8ffb8;
    --accent: #6ee76e;
    --dim: #4a7a4a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(ellipse at center, #0f1a0f 0%, #050805 100%);
    color: var(--fg);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  .scoreboard {
    color: var(--accent);
    letter-spacing: 0.15em;
    font-size: clamp(10px, 2.2vw, 14px);
    margin: 12px 0 4px;
    text-transform: uppercase;
  }
  pre#movie {
    margin: 0;
    padding: clamp(8px, 2vw, 24px);
    line-height: 1.18;
    font-size: clamp(7px, 1.55vw, 15px);
    color: var(--fg);
    text-shadow: 0 0 6px rgba(110, 231, 110, 0.35);
    white-space: pre;
    border: 1px solid var(--dim);
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.55);
    box-shadow: 0 0 30px rgba(110, 231, 110, 0.08), inset 0 0 30px rgba(0,0,0,0.6);
    max-width: 100vw;
    overflow: hidden;
  }
  pre#movie.flash {
    color: #fff;
    text-shadow: 0 0 12px #fff, 0 0 24px var(--accent);
  }
  .controls {
    display: flex;
    gap: 10px;
    margin: 14px 0 22px;
  }
  button {
    font-family: inherit;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--dim);
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 12px;
  }
  button:hover { background: rgba(110, 231, 110, 0.1); }
  .footer {
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 0.08em;
    margin-bottom: 16px;
    text-align: center;
    padding: 0 12px;
  }
</style>
</head>
<body>
  <div class="scoreboard">&gt;&gt; AMBROSE TREACY 9/10C  ::  WILLIAM PERKINS (#9) &lt;&lt;</div>
  <pre id="movie" aria-label="ASCII soccer animation: William Perkins scores"></pre>
  <div class="controls">
    <button id="replay">&#9658; Replay</button>
    <button id="pause">&#10074;&#10074; Pause</button>
  </div>
  <div class="footer">Run. Stepover. Strike. Top bins. On loop, forever.</div>

<script src="movie.js"></script>
<script>
const FRAMES = WillMovie.buildFrames();
const movie = document.getElementById("movie");
const replayBtn = document.getElementById("replay");
const pauseBtn = document.getElementById("pause");

let idx = 0;
let timer = null;
let paused = false;

function showFrame() {
  const f = FRAMES[idx];
  movie.textContent = f.text;
  movie.classList.toggle("flash", f.flash);
  if (!paused) {
    timer = setTimeout(() => {
      idx = (idx + 1) % FRAMES.length;
      showFrame();
    }, f.delay);
  }
}

replayBtn.addEventListener("click", () => {
  if (timer) clearTimeout(timer);
  idx = 0;
  paused = false;
  pauseBtn.textContent = "❚❚ Pause";
  showFrame();
});

pauseBtn.addEventListener("click", () => {
  paused = !paused;
  if (paused) {
    if (timer) clearTimeout(timer);
    pauseBtn.textContent = "▶ Resume";
  } else {
    pauseBtn.textContent = "❚❚ Pause";
    idx = (idx + 1) % FRAMES.length;
    showFrame();
  }
});

showFrame();
</script>
</body>
</html>
