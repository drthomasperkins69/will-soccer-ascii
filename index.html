<title>William Perkins — Goal of the Season (Ambrose Treacy 9/10C)</title>
<style>
  :root {
    --bg: #0a0e0a;
    --fg: #b8ffb8;
    --accent: #6ee76e;
    --dim: #4a7a4a;
    --net: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(ellipse at center, #0f1a0f 0%, #050805 100%);
    color: var(--fg);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  .scoreboard {
    color: var(--accent);
    letter-spacing: 0.15em;
    font-size: clamp(10px, 2.2vw, 14px);
    margin: 12px 0 4px;
    text-transform: uppercase;
  }
  pre#movie {
    margin: 0;
    padding: clamp(8px, 2vw, 24px);
    line-height: 1.15;
    font-size: clamp(7px, 1.55vw, 15px);
    color: var(--fg);
    text-shadow: 0 0 6px rgba(110, 231, 110, 0.35);
    white-space: pre;
    border: 1px solid var(--dim);
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.55);
    box-shadow: 0 0 30px rgba(110, 231, 110, 0.08), inset 0 0 30px rgba(0,0,0,0.6);
    max-width: 100vw;
    overflow: hidden;
  }
  pre#movie.flash {
    color: #fff;
    text-shadow: 0 0 12px #fff, 0 0 24px var(--accent);
    transition: none;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin: 14px 0 22px;
  }
  button {
    font-family: inherit;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--dim);
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 12px;
  }
  button:hover { background: rgba(110, 231, 110, 0.1); }
  .footer {
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 0.08em;
    margin-bottom: 16px;
    text-align: center;
    padding: 0 12px;
  }
</style>

    <button id="pause">&#10074;&#10074; Pause</button>

const movie = document.getElementById("movie");
const replayBtn = document.getElementById("replay");
const pauseBtn = document.getElementById("pause");

let idx = 0;
let timer = null;
let paused = false;

function render() {
  const [delay, frame] = FRAMES[idx];
  movie.textContent = frame;
  // Flash the goal frame
  if (frame.includes("G  O  O  O  A")) {
    movie.classList.add("flash");
    setTimeout(() => movie.classList.remove("flash"), 220);
    setTimeout(() => movie.classList.add("flash"), 440);
    setTimeout(() => movie.classList.remove("flash"), 660);
  }
  if (!paused) {
    timer = setTimeout(() => {
      idx = (idx + 1) % FRAMES.length;
      render();
    }, delay);
  }
}

function play() {
  if (timer) clearTimeout(timer);
  paused = false;
  pauseBtn.textContent = "❚❚ Pause";
  render();
}

replayBtn.addEventListener("click", () => { idx = 0; play(); });
pauseBtn.addEventListener("click", () => {
  paused = !paused;
  if (paused) {
    if (timer) clearTimeout(timer);
    pauseBtn.textContent = "▶ Resume";
  } else {
    pauseBtn.textContent = "❚❚ Pause";
    timer = setTimeout(() => {
      idx = (idx + 1) % FRAMES.length;
      render();
    }, 200);
  }
});

play();
